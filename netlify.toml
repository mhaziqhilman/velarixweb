[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: serve index.html for any path so deep links and anchors work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
